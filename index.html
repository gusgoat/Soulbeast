<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body style="margin:0">
<title>ตำนานผนึกอสูร</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chonburi&family=Anuphan:wght@400;500;600;700&family=Chakra+Petch:wght@500;600&display=swap">
<style>
/* Layout: one-screen phone game — status bar on top, scrolling stage, fixed bottom nav; night-ink world with gold seal accents */
:root{
  --bg:#10121b; --panel:#1a1d2b; --panel2:#232739; --line:#323650; --fg:#ece6d6; --muted:#9a97ab;
  --gold:#d9b35b; --gold-ink:#1d1606; --seal:#6dcfc1; --bad:#e46a5c; --good:#7fd08a; --mp:#6f9cf0;
  --f-display:'Chonburi','Anuphan',Georgia,serif; --f-body:'Anuphan',system-ui,sans-serif; --f-num:'Chakra Petch','Anuphan',ui-monospace,monospace;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
button{font:inherit;color:inherit}
#app{max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:column;background:radial-gradient(120% 60% at 50% -10%,#1e2236 0%,var(--bg) 60%)}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--panel) 85%,transparent)}
.top .who{flex:1;min-width:0;display:flex;flex-direction:column}
.top .who b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .who small{color:var(--muted);font-size:12px}
.coin{font-family:var(--f-num);color:var(--gold);font-weight:600;white-space:nowrap}
main{flex:1;overflow-y:auto;padding-block:14px 20px;padding-inline:16px}
nav.bottom{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--panel)}
nav.bottom button{background:none;border:0;padding:9px 2px 10px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav.bottom button .g{font-family:var(--f-display);font-size:17px;line-height:1}
nav.bottom button.on{color:var(--gold)}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.25;color:var(--gold)}
h2{font-family:var(--f-display);font-weight:400;font-size:20px;line-height:1.3}
h3{font-size:15px;font-weight:600}
.sub{color:var(--muted);font-size:13px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:9px 12px;cursor:pointer;font-weight:500;min-height:40px;text-align:center}
.btn:hover{border-color:var(--gold)}
.btn:focus-visible,nav.bottom button:focus-visible,.ucard:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
.btn.pri{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-weight:700}
.btn.seal{border-color:var(--seal);color:var(--seal)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.full{width:100%}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:1px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap;letter-spacing:.02em}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:4px;background:#0006;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--good);transition:width .35s}
.bar.mp>i{background:var(--mp)}
.bar.xp>i{background:var(--gold)}
.bar.low>i{background:var(--bad)}
.pt{--s:52px;width:var(--s);height:var(--s);flex:none;border-radius:50%;display:grid;place-items:center;position:relative;
  background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--ec) 55%,#fff 8%),color-mix(in srgb,var(--ec) 25%,#0b0c14) 70%);
  box-shadow:0 0 0 2px var(--ec),0 0 14px color-mix(in srgb,var(--ec) 40%,transparent);overflow:hidden;font-size:calc(var(--s)*.5);line-height:1}
.pt::after{content:"";position:absolute;inset:4px;border-radius:50%;border:1px dashed color-mix(in srgb,#fff 35%,transparent);pointer-events:none}
.pt img{width:100%;height:100%;object-fit:cover}
.pt.unk{filter:grayscale(1) brightness(.5)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabs button{flex:none;border:1px solid var(--line);background:none;border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.tabs button.on{border-color:var(--gold);color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,transparent)}
.statgrid{display:grid;grid-template-columns:1fr auto auto;gap:4px 10px;align-items:center;font-size:14px}
.statgrid .num{text-align:right}
.lst{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
.item .grow small{display:block;color:var(--muted);font-size:12px;line-height:1.4}
.place{display:flex;flex-direction:column;gap:6px;text-align:left;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;min-height:118px}
.place:hover{border-color:var(--gold)}
.place .glyph{font-family:var(--f-display);font-size:26px;color:var(--gold);line-height:1}
.place small{color:var(--muted);font-size:12px}
.hero{padding:6px 0 4px}
.log{background:#0a0b12;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;min-height:96px;max-height:132px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.log p{margin:0;color:var(--muted)}
.log p:last-child{color:var(--fg)}
/* battle */
.field{display:flex;flex-direction:column;gap:10px}
.side{display:grid;grid-template-columns:repeat(var(--n,1),minmax(0,1fr));gap:8px}
.ucard{position:relative;display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:left;cursor:default;min-width:0}
.ucard.foe{cursor:pointer}
.ucard.tg{border-color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}
.ucard.turn{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 18px #d9b35b33}
.ucard.down{opacity:.38}
.ucard .grow{display:flex;flex-direction:column;gap:3px}
.ucard .nm{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ucard .meta{font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fx{position:absolute;right:10px;top:4px;font-family:var(--f-num);font-weight:600;font-size:18px;animation:pop 1s ease-out forwards;pointer-events:none;text-shadow:0 1px 3px #000}
.fx.bad{color:var(--bad)}.fx.good{color:var(--good)}.fx.muted{color:var(--muted)}.fx.mp{color:var(--mp)}
@keyframes pop{0%{transform:translateY(6px);opacity:0}20%{transform:none;opacity:1}100%{transform:translateY(-16px);opacity:0}}
.order{display:flex;gap:4px;flex-wrap:wrap;font-size:11px;color:var(--muted);align-items:center}
.order span{padding:1px 7px;border-radius:6px;background:var(--panel2)}
.order span.now{background:var(--gold);color:var(--gold-ink);font-weight:700}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.acts .btn{min-height:46px;font-size:14px;flex-direction:column;gap:0;line-height:1.25}
.acts .btn small{font-size:11px;color:inherit;opacity:.75;font-family:var(--f-num)}
.badge{font-size:11px;padding:1px 7px;border-radius:6px;background:var(--seal);color:#082320;font-weight:700}
.overlay{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:16px;z-index:20}
.overlay .card{max-width:380px;width:100%}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--gold);border-radius:10px;padding:8px 14px;font-size:14px;z-index:30;max-width:calc(100% - 32px);animation:pop2 2.4s forwards}
@keyframes pop2{0%{opacity:0;transform:translate(-50%,8px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
input[type=text]{width:100%;background:#0b0c14;border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--fg);font:inherit}
.pick{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;cursor:pointer;text-align:center}
.pick.on{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.pick small{color:var(--muted);font-size:11px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.dex .card{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:12px 8px}
.res{text-align:center;padding:14px}
.res h2{color:var(--gold);font-size:24px}
.lines{display:flex;flex-direction:column;gap:3px;font-size:14px;margin:10px 0}
.door{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;cursor:pointer;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px 14px 10px 10px;padding:14px 10px;min-height:170px}
.door:hover,.door:focus-visible{border-color:var(--gold);outline:none}
.door small{color:var(--muted);font-size:12px;line-height:1.4}
.door-g{font-family:var(--f-display);font-size:30px;color:var(--gold);line-height:1.1}
.steps{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.steps i{height:8px;border-radius:3px;background:var(--panel2)}
.steps i.done{background:var(--seal)}
.steps i.now{background:var(--gold)}
.steps i.boss{background:color-mix(in srgb,var(--bad) 45%,var(--panel2))}
.steps i.boss.now{background:var(--bad)}
nav.bottom button.lock{opacity:.35}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.door.hid{background:repeating-linear-gradient(135deg,var(--panel) 0 10px,#151724 10px 20px)}
.door.hid .door-g{color:var(--muted)}
.chest{width:92px;height:70px;margin:4px auto 2px;position:relative;border-radius:10px 10px 6px 6px;background:linear-gradient(180deg,color-mix(in srgb,var(--cc) 85%,#fff 15%),color-mix(in srgb,var(--cc) 70%,#000 30%));box-shadow:0 0 22px color-mix(in srgb,var(--cc) 45%,transparent),inset 0 -6px 0 #0004}
.chest::before{content:"";position:absolute;left:0;right:0;top:24px;height:6px;background:#0005}
.chest::after{content:"";position:absolute;left:50%;top:20px;width:14px;height:16px;margin-left:-7px;border-radius:3px;background:#f3d98a;box-shadow:0 0 0 2px #0006}
.chest.open{opacity:.55;filter:saturate(.6)}
.stchip{font-size:10px;padding:0 6px}
.tchart{display:flex;flex-direction:column;gap:6px}
.tchart .item{align-items:flex-start}
.tchart .item>.chip{margin-top:2px}
.eff{font-family:var(--f-num);font-weight:600}
.eff.up{color:var(--good)}.eff.down{color:var(--bad)}.eff.zero{color:var(--muted)}
.ucard.ally{cursor:pointer}
.ucard.at{border-color:var(--seal);box-shadow:inset 0 0 0 1px var(--seal)}
.ucard.turn.at,.ucard.turn.tg{box-shadow:0 0 0 1px var(--gold),0 0 18px #d9b35b33}
.chip.pas{color:var(--seal)}
.mini{display:flex;flex-direction:column;gap:6px}
.tree{display:flex;flex-direction:column;gap:8px}
.order{justify-content:space-between}
.order .grow{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.lgn{color:var(--gold);font-weight:600}
#vfx{position:fixed;inset:0;pointer-events:none;z-index:25;overflow:hidden}
.vx{position:absolute;left:0;top:0;transform:translate(-50%,-50%);will-change:transform,opacity}
.vx-burst{width:96px;height:96px;border-radius:50%;background:radial-gradient(circle,#fff 0,var(--c) 28%,color-mix(in srgb,var(--c) 40%,transparent) 48%,transparent 70%);animation:vburst .55s ease-out forwards}
@keyframes vburst{0%{transform:translate(-50%,-50%) scale(.2);opacity:1}100%{transform:translate(-50%,-50%) scale(1.7);opacity:0}}
.vx-ring{width:72px;height:72px;border-radius:50%;border:3px solid var(--c);box-shadow:0 0 14px var(--c);animation:vring .6s ease-out forwards}
@keyframes vring{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}100%{transform:translate(-50%,-50%) scale(1.8);opacity:0}}
.vx-slash{width:130px;height:5px;border-radius:5px;background:linear-gradient(90deg,transparent,#fff 45%,var(--c) 60%,transparent);box-shadow:0 0 14px var(--c);animation:vslash .38s ease-out forwards}
@keyframes vslash{0%{transform:translate(-50%,-50%) rotate(var(--r)) scaleX(0);opacity:1}65%{opacity:1}100%{transform:translate(-50%,-50%) rotate(var(--r)) scaleX(1.25);opacity:0}}
.vx-p{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);animation:vp .75s ease-out forwards}
.vx-p.shard{border-radius:1px;width:5px;height:13px}
.vx-p.leaf{border-radius:0 70% 0 70%;width:10px;height:10px}
.vx-p.star{width:13px;height:13px;border-radius:0;box-shadow:none;clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%)}
@keyframes vp{0%{transform:translate(-50%,-50%) rotate(0);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--rot));opacity:0}}
.vx-cast{top:40%;left:50%;padding:6px 22px;border-radius:999px;font-family:var(--f-display);font-size:20px;color:#fff;white-space:nowrap;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--c) 65%,#000 20%) 20%,color-mix(in srgb,var(--c) 65%,#000 20%) 80%,transparent);text-shadow:0 0 12px var(--c),0 1px 2px #000;animation:vcast .95s ease-out forwards}
@keyframes vcast{0%{transform:translate(-50%,-50%) scaleX(.6);opacity:0}15%{transform:translate(-50%,-50%) scaleX(1);opacity:1}75%{opacity:1}100%{transform:translate(-50%,-80%);opacity:0}}
.vx-aura{width:84px;height:84px;border-radius:50%;box-shadow:0 0 0 3px var(--c),inset 0 0 28px var(--c);animation:vaura .85s ease-out forwards}
@keyframes vaura{0%{transform:translate(-50%,-30%) scale(.6);opacity:0}30%{opacity:1}100%{transform:translate(-50%,-90%) scale(1.15);opacity:0}}
.vx-charge{width:110px;height:110px;border-radius:50%;border:2px dashed var(--c);box-shadow:0 0 18px var(--c);animation:vcharge .8s ease-in forwards}
@keyframes vcharge{0%{transform:translate(-50%,-50%) scale(1.6) rotate(0);opacity:0}40%{opacity:1}100%{transform:translate(-50%,-50%) scale(.3) rotate(220deg);opacity:0}}
.vx-flash{left:0;top:0;width:100%;height:100%;transform:none;background:var(--c);animation:vflash .4s ease-out forwards}
@keyframes vflash{0%{opacity:.25}100%{opacity:0}}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
@media (prefers-reduced-motion:reduce){#vfx .vx-p,#vfx .vx-slash,#vfx .vx-flash{display:none}}
</style>

<div id="app"></div>
<div id="vfx" aria-hidden="true"></div>
<input type="file" id="imgIn" accept="image/*" hidden>

<script>
'use strict';
/* ================= CORE STATS ================= */
const K=['hp','mp','patk','matk','pdef','mdef','acc','eva','spd','crit'];
const LBL={hp:'พลังชีวิต (HP)',mp:'พลังเวทย์ (MP)',patk:'โจมตีกายภาพ',matk:'โจมตีเวทย์',pdef:'ป้องกันกายภาพ',mdef:'ป้องกันเวทย์',acc:'ความแม่นยำ',eva:'การหลบหลีก',spd:'ความเร็ว',crit:'โอกาสคริติคอล %'};
const SH={hp:'HP',mp:'MP',patk:'ตีกาย',matk:'ตีเวทย์',pdef:'กันกาย',mdef:'กันเวทย์',acc:'แม่นยำ',eva:'หลบ',spd:'เร็ว',crit:'คริ'};
const PER={hp:8,mp:5,patk:1.5,matk:1.5,pdef:1.5,mdef:1.5,acc:2,eva:1.5,spd:1,crit:.5};
const PB=[60,30,8,8,5,5,90,8,10,5], PG=[6,3,1,1,1,1,1,.8,.6,.1];
const MAXLV=60, FM=[1,1.2,1.4], SKLV=[1,5,11,18], SIGLV=12;
const grow=(k,b)=>({hp:b*.2,mp:b*.12,acc:1.1,eva:.5+b*.03,spd:b*.08,crit:.1})[k] ?? b*.17;

/* ================= ELEMENTS ================= */
const EL={normal:{n:'ปกติ',c:'#b3b28a'},fire:{n:'ไฟ',c:'#ee8130'},water:{n:'น้ำ',c:'#6f9cf3'},grass:{n:'พืช',c:'#7ac74c'},electric:{n:'ไฟฟ้า',c:'#f7d02c'},ice:{n:'น้ำแข็ง',c:'#96d9d6'},
 fighting:{n:'ต่อสู้',c:'#e0564e'},poison:{n:'พิษ',c:'#c060be'},ground:{n:'ดิน',c:'#e2bf65'},flying:{n:'บิน',c:'#a98ff3'},psychic:{n:'จิต',c:'#f95587'},bug:{n:'แมลง',c:'#a6b91a'},
 rock:{n:'หิน',c:'#c4ad4a'},ghost:{n:'ผี',c:'#9a7cc4'},dragon:{n:'มังกร',c:'#8a62ff'},dark:{n:'มืด',c:'#a08470'},steel:{n:'เหล็ก',c:'#b7b7ce'},fairy:{n:'เทพ',c:'#e58fbc'}};
const TC={
 normal:{rock:.5,ghost:0,steel:.5},
 fire:{fire:.5,water:.5,grass:2,ice:2,bug:2,rock:.5,dragon:.5,steel:2},
 water:{fire:2,water:.5,grass:.5,ground:2,rock:2,dragon:.5},
 grass:{fire:.5,water:2,grass:.5,poison:.5,ground:2,flying:.5,bug:.5,rock:2,dragon:.5,steel:.5},
 electric:{water:2,grass:.5,electric:.5,ground:0,flying:2,dragon:.5},
 ice:{fire:.5,water:.5,grass:2,ice:.5,ground:2,flying:2,dragon:2,steel:.5},
 fighting:{normal:2,ice:2,poison:.5,flying:.5,psychic:.5,bug:.5,rock:2,ghost:0,dark:2,steel:2,fairy:.5},
 poison:{grass:2,poison:.5,ground:.5,rock:.5,ghost:.5,steel:0,fairy:2},
 ground:{fire:2,grass:.5,electric:2,poison:2,flying:0,bug:.5,rock:2,steel:2},
 flying:{grass:2,electric:.5,fighting:2,bug:2,rock:.5,steel:.5},
 psychic:{fighting:2,poison:2,psychic:.5,dark:0,steel:.5},
 bug:{fire:.5,grass:2,fighting:.5,poison:.5,flying:.5,psychic:2,ghost:.5,dark:2,steel:.5,fairy:.5},
 rock:{fire:2,ice:2,fighting:.5,ground:.5,flying:2,bug:2,steel:.5},
 ghost:{normal:0,psychic:2,ghost:2,dark:.5},
 dragon:{dragon:2,steel:.5,fairy:0},
 dark:{fighting:.5,psychic:2,ghost:2,dark:.5,fairy:.5},
 steel:{fire:.5,water:.5,electric:.5,ice:2,rock:2,steel:.5,fairy:2},
 fairy:{fire:.5,fighting:2,poison:.5,dragon:2,dark:2,steel:.5},
};
const typeMult=(el,types)=>!el||!types?1:types.reduce((m,t)=>m*((TC[el]&&TC[el][t])??1),1);

/* ================= STATUSES & PASSIVES ================= */
const STS={
 burn:{n:'ติดไฟ',c:'#ee8130',d:()=>3,info:'เสีย HP 6% ทุกตา'},
 poison:{n:'ติดพิษ',c:'#c060be',d:()=>4,info:'เสีย HP 8% ทุกตา'},
 freeze:{n:'แช่แข็ง',c:'#96d9d6',d:()=>R(2,3),info:'ขยับไม่ได้ แต่ป้องกันเพิ่ม 50% (โดนธาตุไฟจะละลาย)'},
 chill:{n:'เยือกแข็ง',c:'#9ec9e6',d:()=>3,info:'ความเร็วลด 40%'},

function chain(k){const a=[];while(k){a.unshift(k);k=CLS[k].p}return a}

const baseOf=k=>chain(k)[0];

const clsPas=k=>chain(k).flatMap(c=>CLS[c].pas);
const clsSum=k=>Math.max(1,...chain(k).map(c=>CLS[c].sum||1));

function humanStats(cls,lv,pts,eq){const s={};K.forEach((k,i)=>s[k]=(PB[i]+PG[i]*(lv-1))*clsMult(cls,k)+((pts&&pts[k])||0)*PER[k]);
 for(const sl in eq){const it=EQ[eq[sl]];if(it)for(const k in it.st)s[k]+=it.st[k]}return rnd(s)}
function humanSkills(cls,lv,eq){const a=['attack',...clsSkills(cls,lv)];for(const sl in eq){const it=EQ[eq[sl]];if(!it)continue;if(it.ws)a.push(it.ws);if(it.sk)a.push(it.sk)}return [...new Set(a)]}

const formName=(k,f)=>f?SP[k].ev[f-1][1]:SP[k].n;
const petName=p=>formName(p.sp,p.form||0);
const sigLearned=p=>{const s=SP[p.sp];if(!s.sig)return false;return s.rare?p.lv>=SIGLV:s.ev?(p.form||0)>=s.ev.length:false};
function calcPet(p,wild=1){const sp=SP[p.sp],fm=FM[p.form||0],s={};
 K.forEach((k,i)=>{const b=i<9?sp.b[i]:5,f=(k==='acc'||k==='crit'||k==='eva')?1:fm;s[k]=(b+grow(k,b)*(p.lv-1)*wild)*f+((p.pts&&p.pts[k])||0)*PER[k]});return rnd(s)}
function petSkills(p){const s=SP[p.sp],a=['attack',...s.sk.filter((_,i)=>p.lv>=SKLV[i])];if(sigLearned(p))a.push(s.sig);return a}

function mkPet(sp,lv,form){const p={uid:S.P.uid++,sp,lv,form:form??formFor(sp,lv),exp:0,pts:{},free:(lv-1)*3};const s=calcPet(p);p.hp=s.hp;p.mp=s.mp;return p}

function gainExp(o,amt,isP){const lines=[];o.exp+=amt;
 while(o.lv<MAXLV&&o.exp>=need(o.lv)){const before=isP?pStats():calcPet(o);o.exp-=need(o.lv);o.lv++;o.free=(o.free||0)+(isP?5:3);
  if(!isP){const nf=formFor(o.sp,o.lv);if(nf>(o.form||0)){o.form=nf;lines.push(`✦ ${SP[o.sp].n} พัฒนาร่างเป็น ${formName(o.sp,nf)}!`);if(nf===SP[o.sp].ev.length&&SP[o.sp].sig)lines.push(`${formName(o.sp,nf)} เรียนรู้สกิลเฉพาะตัว ${SK[SP[o.sp].sig].n}`)}}
  const after=isP?pStats():calcPet(o);o.hp+=after.hp-before.hp;o.mp+=after.mp-before.mp;
  lines.push(`${isP?o.name:petName(o)} เลเวลอัปเป็น Lv ${o.lv}!`);
  if(isP){clsSkillsAt(o.cls,o.lv).forEach(id=>lines.push(`เรียนรู้สกิล ${SK[id].n}`));if(canPromote(o)&&(o.lv===25||o.lv===40))lines.push('★ เลื่อนอาชีพได้แล้ว! ไปที่หน้าตัวละคร')}
  else{const i=SKLV.indexOf(o.lv);if(i>0&&SP[o.sp].sk[i])lines.push(`${petName(o)} เรียนรู้ ${SK[SP[o.sp].sk[i]].n}`);if(SP[o.sp].rare&&o.lv===SIGLV)lines.push(`${petName(o)} เรียนรู้สกิลเฉพาะตัว ${SK[SP[o.sp].sig].n}`)}}
 if(o.lv>=MAXLV)o.exp=0;
 return lines}
function loseExp(o,frac){const l=Math.floor(need(o.lv)*frac),lost=Math.min(o.exp,l);o.exp-=lost;return lost}

 let em='?',ec='#d9b35b',img=IMG[key];

 else if(key&&key.startsWith('form:')){const f=FORMS[key.slice(5)];em=f.em;ec=EL[f.t[0]].c;img=null}
 else if(key&&key.startsWith('cls:')){em=CLS[baseOf(key.slice(4))].em}
 else if(SP[key]){em=SP[key].em;ec=EL[SP[key].t[0]].c}
 return `<div class="pt ${opts.unk?'unk':''}" style="--s:${size}px;--ec:${ec}">${img?`<img src="${img}" alt="">`:em}</div>`}
const elChip=e=>e?`<span class="chip" style="color:${EL[e].c}">${EL[e].n}</span>`:'';
const tChips=ts=>(ts||[]).map(elChip).join('');
const pasChip=k=>k&&PAS[k]?`<span class="chip pas" title="${esc(PAS[k].d)}">${PAS[k].n}</span>`:'';
const bar=(v,m,cls='')=>`<div class="bar ${cls} ${!cls&&v/m<.3?'low':''}"><i style="width:${clamp(m?v/m*100:0,0,100)}%"></i></div>`;
const multTxt=m=>m===1?'':`<span class="eff ${m>1?'up':m===0?'zero':'down'}">×${m===.5?'½':m===.25?'¼':m}</span>`;
function skTag(s){if(s.ct)return s.all?'2 ตา หมู่':'2 ตา';if(['heal','buff'].includes(s.t))return s.tg==='team'?'ทั้งทีม':s.tg==='ally'?'เลือกฝ่ายเรา':'ตัวเอง';if(s.t==='form')return 'แปลงร่าง';if(s.all)return 'หมู่';if(s.hits)return `${s.hits} ครั้ง`;return 'เดี่ยว'}
function skillDesc(id){const s=SK[id],a=[];
 if(['p','m','h','auto'].includes(s.t))a.push(`${s.t==='p'?'กายภาพ':s.t==='m'?'เวทย์':s.t==='h'?'ผสม':'ตามอาวุธ'} พลัง ${s.pw}${s.hits?` × ${s.hits} ครั้ง${s.rt?' สุ่มเป้า':''}`:''}`);
 if(s.t==='heal')a.push(`ฟื้น HP ${s.pw}%${s.rev||s.revAll?' ชุบชีวิตได้':''}${s.cure?' ล้างสถานะ':''}`);
 if(s.t==='form')a.push(`เปลี่ยนเป็น${FORMS[s.form].n} ได้สกิลชุดใหม่`);
 if(s.bf){const pos=Object.entries(s.bf).filter(([,v])=>v>0),neg=Object.entries(s.bf).filter(([,v])=>v<0);
  if(pos.length)a.push(`เพิ่ม ${pos.map(([k,v])=>`${SH[k]} ${Math.round(v*100)}%`).join(' ')}`);
  if(neg.length)a.push(`${['buff','heal'].includes(s.t)?'ลดของตัวเอง':'ลดของเป้า'} ${neg.map(([k,v])=>`${SH[k]} ${Math.round(-v*100)}%`).join(' ')}`);
  if(s.tn)a.push(`${s.tn} ตา`)}
 if(s.st)a.push(Object.entries(s.st).map(([k,v])=>`${STS[k].n} ${Math.round(v*100)}%`).join(' '));
 if(s.ct)a.push('ตาแรกรวบรวมพลัง ตาถัดไปปล่อยท่าอัตโนมัติ');if(s.charge)a.push(`การโจมตีครั้งถัดไปแรง ×${s.charge}${s.tg==='team'?' ทั้งทีม':''}`);
 if(s.pas)a.push(`ได้ผล${PAS[s.pas].n}`);if(s.taunt)a.push('ยั่วยุศัตรู');if(s.ls)a.push(`ดูดเลือด ${s.ls*100}%`);if(s.pi)a.push(`เมินเกราะ ${s.pi*100}%`);if(s.cb)a.push(`คริ +${s.cb}%`);
 if(s.acc>=100)a.push('ไม่พลาด');if(s.steal)a.push('ขโมยของ');if(s.gold)a.push('ได้เงิน');if(s.self)a.push(`เสีย HP ตัวเอง ${s.self*100}%`);if(s.ls&&s.t==='heal')a.push('');
 if(s.gc)a.push(`จ่าย ${s.gc}×Lv เหรียญ`);if(s.mp)a.push(`${s.mp} MP`);return a.filter(Boolean).join(' · ')}
function statLine(st){return Object.entries(st).map(([k,v])=>`${SH[k]} +${v}`).join(' · ')}
const itemName=it=>it.legend?`<span class="lgn">✦ ${it.n}</span>`:it.n;
function itemExtra(it){return `${it.pas?' · '+PAS[it.pas].n:''}${it.ws?' · สกิล '+SK[it.ws].n:''}${it.sk?' · สกิล '+SK[it.sk].n:''}`}

const B=()=>S.battle;
/* ---- skill visual effects (queued during battle logic, played after each render) ---- */
const VQ=[],vfx=(k,id,o={})=>{if(S.battle)VQ.push({k,id,...o})};
const ELSHAPE={ice:'shard',electric:'shard',rock:'shard',steel:'shard',grass:'leaf',bug:'leaf',fairy:'star',psychic:'star',dragon:'star'};
function vSpawn(L,cls,pos,c,txt,vars){const d=document.createElement('div');d.className='vx '+cls;d.style.setProperty('--c',c);if(pos){d.style.left=pos[0]+'px';d.style.top=pos[1]+'px'}
 if(vars)for(const k in vars)d.style.setProperty(k,vars[k]);if(txt)d.textContent=txt;L.appendChild(d);setTimeout(()=>d.remove(),1100)}
function vParts(L,x,y,c,shape,n,dist,up){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,r=dist*(.5+Math.random()*.7);vSpawn(L,'vx-p '+shape,[x,y],c,null,{'--dx':Math.cos(a)*r+'px','--dy':(Math.sin(a)*r+up*28)+'px','--rot':R(0,360)+'deg'})}}
function flushVfx(){if(!VQ.length)return;const q=VQ.splice(0);try{const L=document.getElementById('vfx'),app=document.getElementById('app');if(!L||!app||!app.querySelector)return;
 let delay=0,shake=false;
 q.forEach(e=>{const c=e.c||(e.el?EL[e.el].c:'#f3e3b0');
  const play=()=>{if(e.k==='cast')return vSpawn(L,'vx-cast',null,c,e.n);if(e.k==='flash')return vSpawn(L,'vx-flash',null,c);
   const el=app.querySelector(`[data-u="${e.id}"]`);if(!el)return;const r=el.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;
   if(e.k==='hit'){if(e.phys){vSpawn(L,'vx-slash',[x,y],c,null,{'--r':R(-50,-20)+'deg'});if(e.crit)vSpawn(L,'vx-slash',[x,y],c,null,{'--r':R(20,50)+'deg'})}
    vSpawn(L,'vx-burst',[x,y],c);vParts(L,x,y,c,ELSHAPE[e.el]||'',e.crit?14:8,e.crit?80:55,e.el==='fire'?-1:e.el==='water'||e.el==='poison'?1:0)}
   else if(e.k==='heal'){vSpawn(L,'vx-ring',[x,y],'#7fd08a');vParts(L,x,y,'#9be89f','star',8,40,-2)}
   else if(e.k==='buff')vSpawn(L,'vx-aura',[x,y],c);
   else if(e.k==='debuff'){vSpawn(L,'vx-ring',[x,y],c);vParts(L,x,y,c,'',6,38,1)}
   else if(e.k==='miss')vSpawn(L,'vx-ring',[x,y],'#9a97ab');
   else if(e.k==='charge'){vSpawn(L,'vx-charge',[x,y],'#6f9cf0');vSpawn(L,'vx-aura',[x,y],'#6f9cf0')}};
  if(e.k==='hit'&&e.crit)shake=true;setTimeout(play,delay);if(e.k==='hit')delay+=90});
 if(shake)setTimeout(()=>{app.classList.remove('shake');void app.offsetWidth;app.classList.add('shake')},60)}catch(err){}}
function unit(o){return {buffs:[],status:{},pas:[],stab:[],types:[],taunt:0,...o}}
function playerUnit(){const P=S.P,s=pStats(),w=EQ[P.eq.weapon];
 return unit({id:'P',side:'ally',kind:'player',name:P.name,lv:P.lv,st:s,hp:Math.min(P.hp,s.hp),mp:Math.min(P.mp,s.mp),skills:humanSkills(P.cls,P.lv,P.eq),pas:humanPas(P.cls,P.eq),stab:w&&w.el?[w.el]:[],atkType:w?w.t:'p',img:'player',cls:P.cls})}
function petUnit(p){const s=calcPet(p);return unit({id:'pet'+p.uid,uid:p.uid,side:'ally',kind:'pet',sp:p.sp,name:petName(p),types:SP[p.sp].t.slice(),stab:SP[p.sp].t,lv:p.lv,st:s,hp:Math.min(p.hp,s.hp),mp:Math.min(p.mp,s.mp),skills:petSkills(p),pas:[SP[p.sp].pas],atkType:s.patk>=s.matk?'p':'m',img:p.sp})}
function wildUnit(sp,lv,i,boss){const t={sp,lv,form:formFor(sp,lv),pts:{}},s=calcPet(t,1.1);
 if(boss){s.hp=Math.round(s.hp*2);['patk','matk','pdef','mdef'].forEach(k=>s[k]=Math.round(s[k]*1.15))}
 return unit({id:'e'+i,side:'enemy',kind:'beast',sp,evo:t.form,name:boss||petName(t),types:SP[sp].t.slice(),stab:SP[sp].t,lv,st:s,hp:s.hp,mp:s.mp,skills:petSkills(t),pas:[SP[sp].pas],atkType:s.patk>=s.matk?'p':'m',boss:!!boss,r:SP[sp].r*(boss?2.5:1),img:sp})}
function npcEq(cls,lv){const t=WLV.reduce((a,l,i)=>lv>=l?i:a,0),g=TIERS.reduce((a,x,i)=>lv>=x[1]?i:a,0);return {weapon:`wp_${clsWeapon(cls)}${t}`,armor:'armor_'+g,gloves:'gloves_'+g,boots:'boots_'+g}}
function humanUnit(name,cls,lv,i){const eq=npcEq(cls,lv),focus=clsMult(cls,'patk')>=clsMult(cls,'matk')?'patk':'matk',pts={},n=5*(lv-1);
 Object.entries({[focus]:.35,hp:.25,pdef:.1,mdef:.1,spd:.1,acc:.1}).forEach(([k,v])=>pts[k]=n*v);
 const s=humanStats(cls,lv,pts,eq);s.hp=Math.round(s.hp*1.3);const w=EQ[eq.weapon];
 return unit({id:'e'+i,side:'enemy',kind:'human',name,cls,lv,st:s,hp:s.hp,mp:s.mp,skills:humanSkills(cls,lv,eq).filter(k=>!['form','revert'].includes(SK[k].t)&&!SK[k].gc),pas:humanPas(cls,eq),stab:w&&w.el?[w.el]:[],atkType:w.t,img:'npc:'+cls})}

function startBattle(enemies,kind,meta,pre){VQ.length=0;
 const P=S.P,allies=[playerUnit()],used=[];
 party().filter(p=>p.hp>0).slice(0,clsSum(P.cls)).forEach(p=>{allies.push(petUnit(p));used.push(p.uid)});
 enemies.forEach(e=>{if(e.sp)P.seen[e.sp]=1});
 S.battle={v:4,kind,meta,enemies,allies,round:0,queue:[],cur:null,log:[],target:0,atarget:allies.length>1&&baseOf(P.cls)==='summoner'?1:0,menu:'wait',over:null,used,fx:[]};
 S.screen='battle';if(pre)blog(pre);
 blog(kind==='npc'?`${enemies[0].name} ท้าประลองกับคุณ!`:kind==='traveler'?`นักเดินทางถอดผ้าคลุมออก... ${enemies[0].name} Lv ${enemies[0].lv} พุ่งเข้าโจมตี!`:kind==='bandit'?`${enemies[0].name} ตะโกนว่า "ทิ้งเงินไว้แล้วไปซะ!"`:kind==='boss'?`${enemies[0].name} ปรากฏตัว! บรรยากาศหนักอึ้ง`:enemies[0].rare?`★ ${enemies[0].name} ปรากฏตัวจากหมอก! อสูรหายาก`:enemies.length>1?`ฝูงอสูร ${enemies.length} ตัวพุ่งเข้าใส่!`:`${enemies[0].name} Lv ${enemies[0].lv} โผล่ออกมา!`);
 allU().forEach(u=>{if(hasPas(u,'intimidate')&&u.hp>0){foesOf(u).forEach(f=>f.buffs.push({st:'patk',amt:-.2,tn:4}));blog(`${u.name} ข่มขวัญ! ฝ่ายตรงข้ามโจมตีกายภาพลดลง`)}});
 newRound()}
function blog(t){const b=B();b.log.push(t);if(b.log.length>60)b.log.shift()}
const allU=()=>[...B().allies,...B().enemies];
const uById=id=>allU().find(u=>u.id===id);
const sideOf=u=>u.side==='ally'?B().allies:B().enemies;
const foesOf=u=>u.side==='ally'?B().enemies:B().allies;
const hasPas=(u,k)=>u.pas.includes(k)||u.buffs.some(b=>b.pas===k);
function eff(u,k){const a=u.buffs.reduce((s,b)=>b.st===k?s+b.amt:s,0);let v=u.st[k]*(1+Math.max(-.6,a));
 if(u.form){const f=FORMS[u.form].m[k];if(f)v*=f}
 const s=u.status;if(s.freeze&&(k==='pdef'||k==='mdef'))v*=1.5;if(k==='spd'){if(s.chill)v*=.6;if(s.static)v*=.7}if(k==='acc'&&s.static)v*=.9;
 if(k==='spd'&&hasPas(u,'swift'))v*=1.2;if(k==='eva'&&hasPas(u,'elusive'))v*=1.25;if(k==='acc'&&hasPas(u,'eagle'))v*=1.15;if(k==='crit'&&hasPas(u,'keen'))v+=10;
 if((k==='patk'||k==='matk')&&hasPas(u,'rage')&&u.hp<u.st.hp/2)v*=1.3;
 if((k==='pdef'||k==='mdef')&&hasPas(u,'laststand')&&u.hp<u.st.hp*.3)v*=1.5;
 return Math.max(k==='crit'?0:1,v)}
const hitChance=(u,t,sk)=>clamp(eff(u,'acc')-eff(t,'eva')+15+((sk&&sk.acc)||0),25,100);
function fxAdd(u,t,c){B().fx.push({id:u.id,t,c})}
function newRound(){const b=B();b.round++;const sp=u=>eff(u,'spd')*(b.round===1&&hasPas(u,'firstblood')?2:1);
 const ord=allU().filter(u=>u.hp>0).map(u=>[u,sp(u)*(0.97+Math.random()*.06)]).sort((x,y)=>y[1]-x[1]);b.queue=[];
 ord.forEach(([u])=>{b.queue.push(u.id);const opp=foesOf(u).filter(x=>x.hp>0);if(opp.length&&sp(u)>=2*Math.max(...opp.map(sp)))b.queue.push(u.id+'*')});advance()}
const costOf=(u,sk)=>sk.mp?Math.round(sk.mp*(hasPas(u,'mpsave')?.7:1)):0;
function releaseCharge(u){const b=B();if(!b||b.over)return;const c=u.charging;u.charging=null;const t=c.tid&&uById(c.tid);blog(`${u.name} ปลดปล่อยพลัง!`);act(u,c.id,t&&t.hp>0?t:null,null,true);render();setTimeout(advance,650)}
function checkEnd(){const b=B();if(b.over)return true;if(b.allies[0].hp<=0){endBattle('lose');return true}if(b.enemies.every(e=>e.hp<=0)){endBattle('win');return true}return false}
function hurt(u,d,c='bad'){u.hp=Math.max(0,u.hp-d);fxAdd(u,'-'+d,c);
 if(u.hp<=0){if(hasPas(u,'rebirth')&&!u.reborn){u.reborn=1;u.hp=Math.round(u.st.hp*.4);u.status={};blog(`${u.name} ลุกขึ้นจากเถ้าถ่าน! ฟื้นคืนชีพ`);fxAdd(u,'คืนชีพ','good')}else blog(`${u.name} ล้มลง`)}}
function heal(u,a){const v=Math.min(u.st.hp-u.hp,Math.round(a));if(v>0){u.hp+=v;fxAdd(u,'+'+v,'good')}return v}
function turnStart(u){const s=u.status;
 u.buffs.forEach(x=>x.tn--);u.buffs=u.buffs.filter(x=>x.tn>0);if(u.taunt>0)u.taunt--;
 if(hasPas(u,'regen')&&u.hp<u.st.hp)heal(u,u.st.hp*.06);
 if(hasPas(u,'mpregen'))u.mp=Math.min(u.st.mp,u.mp+Math.round(u.st.mp*.08));
 for(const k of ['burn','poison'])if(s[k]){const d=Math.max(1,Math.round(u.st.hp*(k==='burn'?.06:.08)));blog(`${u.name} ${k==='burn'?'โดนไฟเผา':'โดนพิษกัดกร่อน'} เสีย ${d} HP`);hurt(u,d);if(u.hp<=0)return true}
 if(s.freeze){s.freeze--;if(s.freeze<=0){delete s.freeze;blog(`น้ำแข็งที่ห่อหุ้ม ${u.name} ละลายแล้ว`)}else{blog(`${u.name} ถูกแช่แข็ง ขยับไม่ได้`);return true}}
 if(s.sleep){s.sleep--;if(s.sleep<=0){delete s.sleep;blog(`${u.name} ตื่นขึ้นแล้ว`)}else{blog(`${u.name} หลับปุ๋ย...`);fxAdd(u,'Zzz','muted');return true}}
 let skip=null;
 if(s.para&&Math.random()<.25)skip=`${u.name} เป็นอัมพาต ขยับตัวไม่ได้`;
 else if(s.love&&Math.random()<.45)skip=`${u.name} หลงรักจนเหม่อลอย ไม่ยอมโจมตี`;
 else if(s.confuse&&Math.random()<.35){const d=Math.max(1,Math.round(u.st.hp*.06));skip=`${u.name} มึนงง ทำร้ายตัวเอง ${d} HP`;hurt(u,d)}
 for(const k of ['burn','poison','chill','static','love','confuse','charm','para'])if(s[k]){s[k]--;if(s[k]<=0){delete s[k];blog(`${u.name} หายจากอาการ${STS[k].n}`)}}
 if(skip){blog(skip);return true}return false}
function advance(){const b=B();if(!b||b.over)return;b.fx=[];if(checkEnd()){render();return}
 while(b.queue.length){const q=b.queue.shift(),extra=q.endsWith('*'),u=uById(q.replace('*',''));if(!u||u.hp<=0)continue;
  if(!extra&&turnStart(u)){if(checkEnd()){render();return}continue}
  if(extra&&(u.status.freeze||u.status.sleep))continue;
  b.cur=u.id;b.extra=extra;if(extra)blog(`${u.name} เร็วกว่าเกิน 2 เท่า ได้เคลื่อนไหวอีกครั้ง!`);
  if(u.charging){b.menu='wait';render();setTimeout(()=>releaseCharge(u),550);return}if(!(b.enemies[b.target]&&b.enemies[b.target].hp>0))b.target=b.enemies.findIndex(e=>e.hp>0);
  if(u.side==='enemy'||(u.kind==='pet'&&S.ui.autoPet)){b.menu='wait';render();setTimeout(aiAct,u.side==='enemy'?700:450)}else{b.menu='main';render()}
  return}
 newRound()}
function applyStatus(t,k,ch){if(t.hp<=0||t.status[k])return;if(IMM[k]&&t.types.some(x=>IMM[k].includes(x)))return;
 if(t.pas.some(p=>PAS[p]&&PAS[p].imm&&PAS[p].imm.includes(k)))return;
 if((k==='freeze'||k==='sleep')&&(t.status.freeze||t.status.sleep))return;
 if(Math.random()<ch){t.status[k]=STS[k].d();blog(`${t.name} ${STS[k].n}!`);fxAdd(t,STS[k].n,'mp')}}

   +`<h3>อุปกรณ์ในกระเป๋า</h3>`+(P.owned.length?P.owned.map(id=>`<div class="item"><div class="grow"><b>${itemName(EQ[id])}</b><small>${statLine(EQ[id].st)}${itemExtra(EQ[id])}</small></div><button class="btn sm" data-a="sellgear" data-v="${id}">ขาย <span class="num">${fmt(EQ[id].price/2)}</span></button></div>`).join(''):`<p class="sub">ไม่มีอุปกรณ์ที่ไม่ได้สวมใส่</p>`)}
 return `<div class="stack"><div class="row"><h2 class="grow">ตลาดช่างตีเหล็ก</h2><button class="btn sm" data-a="go" data-v="town">กลับเมือง</button></div>

function vHospital(){const P=S.P,s=pStats();return `<div class="stack"><div class="row"><h2 class="grow">โรงพยาบาลวิหารขาว</h2><button class="btn sm" data-a="go" data-v="town">กลับเมือง</button></div>

 <div class="lst">${[...ZN.filter(z=>z.train),...ZN.filter(z=>!z.train)].map(z=>{const open=z.train||P.zoneMax>=z.id;return `<div class="card stack" style="${open?'':'opacity:.55'}"><div class="row"><div class="grow"><h3>${z.n}</h3><span class="sub">อสูร Lv ${z.lv[0]}–${z.lv[1]} · บอส ${z.boss.n} Lv ${z.boss.lv}</span></div>

   ${parts.length?`<h3>รับซื้อชิ้นส่วน (80% ของราคาในเมือง)</h3><div class="lst">${parts.map(([key,n])=>{const [sp,i]=key.split('|'),pt=SP[sp].parts[+i];return `<div class="item">${portrait(sp,32)}<div class="grow"><b>${pt[0]} ×${n}</b><small class="num">${fmt(Math.round(partPrice(pt[1])*.8)*n)} เหรียญ</small></div><button class="btn sm" data-a="vsell" data-v="${key}">ขายหมด</button></div>`}).join('')}</div>`:''}`}
  if(ev.type==='hospital')extra=ev.healed?'<p class="sub" style="margin:0">ทุกคนหายดีแล้ว</p>':allFull()?'<button class="btn full" disabled>ทุกคนพลังเต็มอยู่แล้ว</button>':`<button class="btn pri full" data-a="zheal">รักษาทั้งทีม · <span class="num">${fmt(Math.round(healCost()*1.5))}</span> เหรียญ</button>`;

  <button class="btn ${ev.type==='chest'&&!ev.opened?'':'pri'} full" data-a="cont" style="min-height:50px">${contLbl}</button>`}
 else if(!zs.fork){main=`<div class="card stack" style="border-color:var(--bad)"><div class="row"><span class="door-g" style="color:var(--bad)">王</span><div class="grow"><h3>รังของ${z.boss.n}</h3><div class="sub">บอส Lv ${z.boss.lv} · ${tChips(SP[z.boss.sp].t)}${z.mini?` · มีสมุน ${z.mini} ตัว`:''} · หนีไม่ได้</div></div></div>

 return `<div class="stack"><div><h2>${z.n}</h2><span class="sub">อสูร Lv ${z.lv[0]}–${z.lv[1]} · ออกได้เมื่อชนะบอส เจอทางออก หรือพ่ายแพ้</span></div>

 ${miniStatus()}${main}<div class="log">${zs.log.map(l=>`<p>${l}</p>`).join('')}</div></div>`}
function ucard(u,i){const b=B(),fx=b.fx.filter(f=>f.id===u.id).map(f=>`<span class="fx ${f.c}">${f.t}</span>`).join(''),foe=u.side==='enemy';
 const sts=Object.keys(u.status).map(k=>`<span class="chip stchip" style="color:${STS[k].c}">${STS[k].n}</span>`).join('');
 const bs={};u.buffs.forEach(x=>{if(x.st)bs[x.st]=(bs[x.st]||0)+x.amt});
 const bf=Object.entries(bs).filter(([,v])=>v).map(([k,v])=>`<span class="chip stchip" style="color:var(--${v>0?'good':'bad'})">${SH[k]}${v>0?'↑':'↓'}</span>`).join('')+(u.taunt>0?'<span class="chip stchip" style="color:var(--gold)">ยั่วยุ</span>':'')+(u.charging?'<span class="chip stchip" style="color:var(--mp)">กำลังชาร์จ</span>':'')+(u.charge>1?`<span class="chip stchip" style="color:var(--mp)">พลัง×${u.charge}</span>`:'')+(u.form?`<span class="chip stchip" style="color:var(--seal)">${FORMS[u.form].n}</span>`:'');
 const sel=foe?(i===b.target&&u.hp>0&&!b.over?'tg':''):(i===b.atarget&&!b.over&&b.allies.length>1?'at':'');
 return `<button data-u="${u.id}" class="ucard ${foe?'foe':'ally'} ${sel} ${b.cur===u.id&&!b.over?'turn':''} ${u.hp<=0?'down':''}" data-a="bt" data-v="${foe?'target':'ally'}:${i}">
 ${portrait(u.img,foe?44:38)}<div class="grow"><span class="nm">${esc(u.name)}</span><span class="meta"><span class="num">Lv ${u.lv}</span>${tChips(u.types)}${u.captured?'<span class="chip" style="color:var(--seal)">ถูกผนึก</span>':''}</span>
 ${sts||bf?`<span class="meta">${sts}${bf}</span>`:''}
 ${bar(u.hp,u.st.hp)}<span class="meta num">HP ${u.hp}/${u.st.hp}${foe?'':` · MP ${u.mp}`}</span>${foe?'':bar(u.mp,u.st.mp,'mp')}</div>${fx}</button>`}

 <h3>สถานะผิดปกติ</h3><div class="lst">${Object.entries(STS).map(([k,s])=>`<div class="item"><span class="chip" style="color:${s.c}">${s.n}</span><div class="grow" style="font-size:13px">${s.info}${IMM[k]?`<div class="sub" style="font-size:12px">ธาตุ${IMM[k].map(x=>EL[x].n).join(' ')}ไม่ติดสถานะนี้</div>`:''}</div></div>`).join('')}</div>`}
function vTeam(){const P=S.P,tab=S.ui.team||'team';if(S.ui.petView!=null){const p=petBy(S.ui.petView);if(p)return vPet(p)}
 const tabs=`<div class="tabs"><button class="${tab==='team'?'on':''}" data-a="teamtab" data-v="team">อสูรในผนึก ${P.pets.length}/${MAXPETS}</button><button class="${tab==='dex'?'on':''}" data-a="teamtab" data-v="dex">สมุดอสูร</button><button class="${tab==='chart'?'on':''}" data-a="teamtab" data-v="chart">ตารางธาตุ</button></div>`;
 if(tab==='chart')return `<div class="stack"><h2>ตารางธาตุ</h2>${tabs}${vChart()}</div>`;
 if(tab==='dex'){const ks=Object.keys(SP).filter(k=>!SP[k].noseal);return `<div class="stack"><h2>สมุดอสูร</h2>${tabs}<p class="sub">จับแล้ว ${ks.filter(k=>P.caught[k]).length}/${ks.length} · ใส่รูปของคุณเองให้อสูรแต่ละตัวได้ รูปสี่เหลี่ยมจัตุรัสจะสวยที่สุด</p>
  <div class="dex">${ks.map(k=>{const s=SP[k],seen=P.seen[k];return `<div class="card">${portrait(k,60,{unk:!seen&&!IMG[k]})}<b>${seen?s.n:'???'}</b>${s.rare?'<span class="chip" style="color:var(--gold)">หายาก</span>':''}<span class="sub" style="font-size:12px">${s.o}</span><span class="row wrap" style="gap:3px;justify-content:center">${tChips(s.t)}</span>
   ${seen?`<span class="sub" style="font-size:11px">${PAS[s.pas].n}${s.ev?` · ${s.ev.map(e=>e[1]).join(' → ')}`:''}</span>`:''}<span class="sub" style="font-size:12px">${P.caught[k]?'จับแล้ว':seen?'พบแล้ว':'ยังไม่พบ'}</span>
   <div class="row" style="gap:4px"><button class="btn sm" data-a="img" data-v="${k}">ใส่รูป</button>${IMG[k]?`<button class="btn sm" data-a="delimg" data-v="${k}">ลบ</button>`:''}</div></div>`}).join('')}</div></div>`}
 const n=clsSum(P.cls);
 return `<div class="stack"><h2>อสูรในผนึก</h2>${tabs}<p class="sub" style="margin:0">ทีมออกสู้ ${P.party.length}/${n} ตัว (ตามอาชีพ) · แตะอสูรเพื่อดูรายละเอียด อัปสถานะ หรือจัดทีม</p>
 <div class="lst">${P.pets.map(p=>{const q=calcPet(p),inP=P.party.includes(p.uid);return `<div class="item">${portrait(p.sp,44)}<button class="grow" style="text-align:left;background:none;border:0;padding:0;cursor:pointer" data-a="petview" data-v="${p.uid}"><b>${petName(p)} <span class="num sub">Lv ${p.lv}</span> ${p.free>0?`<span class="chip" style="color:var(--gold)">+${p.free}</span>`:''}</b>${bar(Math.max(0,p.hp),q.hp)}<small class="num">${p.hp<=0?'หมดสติ':`HP ${p.hp}/${q.hp}`} · ${SP[p.sp].t.map(x=>EL[x].n).join('/')}</small></button><button class="btn sm ${inP?'pri':''}" data-a="partytoggle" data-v="${p.uid}">${inP?'ในทีม':'เข้าทีม'}</button></div>`}).join('')}</div></div>`}
function vBag(){const P=S.P,its=Object.keys(CON).filter(k=>P.items[k]>0),parts=Object.entries(P.parts).filter(([,n])=>n>0),pp=party();
 return `<div class="stack"><h2>กระเป๋า</h2>${miniStatus()}<div class="card stack"><h3>ยา ยาแก้สถานะ และผนึก</h3>${its.length?`<div class="lst">${its.map(k=>{const c=CON[k];return `<div class="row wrap"><div class="grow"><b>${c.n} ×${P.items[k]}</b><div class="sub" style="font-size:12px">${c.d}</div></div>${c.seal||c.cure?'<span class="sub">ใช้ในการต่อสู้</span>':`<div class="row wrap" style="gap:4px">${c.rev?'':`<button class="btn sm" data-a="use" data-v="${k}:P">ตัวเอง</button>`}${pp.map(p=>`<button class="btn sm" data-a="use" data-v="${k}:${p.uid}">${petName(p).slice(0,8)}</button>`).join('')}</div>`}</div>`}).join('')}</div>`:'<p class="sub">ว่างเปล่า</p>'}</div>
 <div class="card stack"><h3>ชิ้นส่วนอสูร</h3>${parts.length?`<div class="lst">${parts.map(([key,n])=>{const [sp,i]=key.split('|');return `<div class="row">${portrait(sp,28)}<span class="grow">${SP[sp].parts[+i][0]}</span><span class="num">×${n}</span></div>`}).join('')}</div>${S.zone?'':'<button class="btn sm" data-a="go" data-v="shop">ไปขายที่ตลาด</button>'}`:'<p class="sub" style="margin:0">ล้มอสูรในป่าเพื่อเก็บชิ้นส่วนไปขาย</p>'}</div></div>`}

function render(){
 const app=document.getElementById('app');if(S.screen!=='start'&&!S.P)S.screen='start';
 if(S.screen==='battle'&&!S.battle)S.screen=S.zone?'zone':'town';
 if(S.screen==='zone'&&!S.zone)S.screen='wild';
 if(S.screen==='wild'&&S.zone)S.screen='zone';
 const V={forge:vForge,start:vStart,town:vTown,shop:vShop,hospital:vHospital,arena:vArena,wild:vWild,zone:vZone,battle:vBattle,hero:vHero,team:vTeam,bag:vBag}[S.screen]||vTown;
 const P=S.P,inB=S.screen==='battle',start=S.screen==='start';
 const navOn=k=>({town:['town','shop','hospital','arena','forge'],wild:['wild','zone'],hero:['hero'],team:['team'],bag:['bag']})[k].includes(S.screen);
 const keepNm=document.getElementById('nm')?.value;
 app.innerHTML=(start?'':`<header class="top">${portrait('player',34)}<div class="who"><b>${esc(P.name)} <span class="sub" style="font-weight:400">${CLS[P.cls].n}</span></b><small class="num">Lv ${P.lv} · ${S.zone?ZN[S.zone.id-1].n+' · ก้าว '+S.zone.depth:'นครพันผนึก'}</small></div><span class="coin" style="${P.gold<0?'color:var(--bad)':''}">${P.gold<0?'หนี้ ':''}${fmt(P.gold)} <small style="font-family:var(--f-body);font-weight:400">เหรียญ</small></span></header>`)
  +`<main>${V()}</main>`
  +(start||inB?'':`<nav class="bottom">${[['town','เมือง','城'],['wild','ป่า','林'],['hero','ตัวละคร','我'],['team','อสูร','封'],['bag','กระเป๋า','包']].map(([k,n,g])=>`<button class="${navOn(k)?'on':''} ${S.zone&&k==='town'?'lock':''}" data-a="go" data-v="${k}"><span class="g">${g}</span>${n}${k==='hero'&&canPromote(P)?' •':''}</button>`).join('')}</nav>`)
  +(S.ui.confirm?`<div class="overlay"><div class="card stack"><p style="margin:0">${S.ui.confirm.msg}</p><div class="row" style="justify-content:flex-end"><button class="btn" data-a="cancel">ยกเลิก</button><button class="btn danger" data-a="${S.ui.confirm.act}" data-v="${S.ui.confirm.v??''}">ยืนยัน</button></div></div></div>`:'');
 if(keepNm!=null&&document.getElementById('nm'))document.getElementById('nm').value=keepNm;
 const lg=document.getElementById('blog');if(lg)lg.scrollTop=lg.scrollHeight;
 if(inB&&VQ.length)(window.requestAnimationFrame||setTimeout)(flushVfx);
 if(!inB)save()}

/* ================= BOOT & MIGRATION ================= */
function migrate(){if(!S.P)return;const P=S.P;
 if(!P.cls){P.cls=P.style==='m'?'mage':'swordsman';delete P.style}
 if(!P.eq.weapon||!EQ[P.eq.weapon]){P.eq.weapon=`wp_${clsWeapon(P.cls)}0`}
 for(const sl in P.eq)if(!EQ[P.eq[sl]])delete P.eq[sl];
 const bad=P.owned.filter(id=>!EQ[id]);if(bad.length){P.gold+=bad.length*300;P.owned=P.owned.filter(id=>EQ[id])}
 P.pets=P.pets.filter(p=>SP[p.sp]);P.pets.forEach(p=>{if(p.form==null)p.form=formFor(p.sp,p.lv);p.pts=p.pts||{}});
 if(!P.party){P.party=P.active!=null?[P.active]:[];delete P.active}
 P.legend=P.legend||{};if(P.lv>=MAXLV){P.lv=MAXLV;P.exp=0}fixParty();S.ver=6}
function boot(data){if(data&&data.S){S=data.S;try{const t=localStorage.getItem(SAVEIMG);if(t)IMG=JSON.parse(t)||{}}catch(e){}}else load();
 S.ui=S.ui||{};S.ui.confirm=null;migrate();
 if(S.battle&&S.battle.v!==4){S.battle=null;S.screen=S.zone?'zone':'town'}
 if(S.zone&&(S.zone.depth==null||(S.zone.fork&&typeof S.zone.fork[0]==='string'))){S.zone.depth=S.zone.depth||0;S.zone.log=S.zone.log||[];S.zone.ev=null;newFork()}
 if(S.zone&&!S.zone.fork&&!S.zone.ev&&S.zone.depth<ZDEPTH&&!S.battle)newFork();
 render();cloudInit();
 const b=S.battle;if(b&&!b.over){const u=b.cur&&uById(b.cur);if(!u||u.side==='enemy'||b.menu==='wait'){if(u&&u.side==='ally'&&!(u.kind==='pet'&&S.ui.autoPet)){b.menu='main';render()}else setTimeout(u?aiAct:advance,600)}}}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});

</script>
