  if(m.type==='formation-editor-state'){if(m.context!==currentContext())return;const next=m.layouts?.[m.context]||{},prior=sentLayouts[m.context]||{};let changed=false;for(const side of ['enemy','ally']){const units=selectSide(next,side);if(JSON.stringify(units)===JSON.stringify(selectSide(prior,side)))continue;const key=sideKey(profile().id,side,$(side==='enemy'?'left-count':'right-count').value,m.context.endsWith('hidden')?'hidden':'shown');if(Object.keys(units).length)rememberSide(side,units);else delete manualLayouts[key];changed=true;}sentLayouts=m.layouts||{};if(changed)persistLayouts();syncStatus();return;}
  if(m.type==='ordinary-render-error'){$('error').hidden=false;$('error').textContent='โหลดสนามไม่สำเร็จ กรุณารีเฟรชเพื่อลองใหม่';return;}
  if(m.type==='ordinary-command'){
   if(m.command==='speed'){speed=m.speed;publish()}
   else if(m.command==='timeout')publish();
   else {post('ordinary-notice',{message:'ตัวทดลองสำหรับดูการจัดแถว · เลือกจำนวนได้จากแถบด้านบน'});publish();}
  }
 });
 $('left-count').onchange=$('right-count').onchange=()=>{rememberSide('enemy');rememberSide('ally');persistLayouts();saveCounts();publish()};$('editor-profile').onchange=()=>{rememberSide('enemy');rememberSide('ally');persistLayouts();setProfileCounts();publish()};$('fallen').onchange=publish;
 $('menu-toggle').onclick=()=>{rememberSide('enemy');rememberSide('ally');persistLayouts();loadEditor();frame.contentDocument.getElementById('toggle-menu').click()};
 function setEditing(value){editing=value;$('edit-mode').setAttribute('aria-pressed',String(editing));$('edit-mode').textContent=editing?'เสร็จแล้ว':'จัดเอง';post('formation-editor',{enabled:editing});syncStatus();};$('edit-mode').onclick=()=>setEditing(!editing);
 
 async function shareLayout(all=false){const url=new URL(location.href);url.search=new URLSearchParams({v:'all-mode-counts-20261122-1',mode:profile().id,left:$('left-count').value,right:$('right-count').value,menu:$('menu-toggle').getAttribute('aria-pressed')==='true'?'hidden':'shown',tools:document.querySelector('header').classList.contains('minimized')?'hidden':'shown'});if(all){const text=JSON.stringify({v:3,layouts:manualLayouts});let packed='raw:'+text;if(typeof CompressionStream!=='undefined'){const bytes=new Uint8Array(await new Response(new Blob([text]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer());packed=btoa(Array.from(bytes,b=>String.fromCharCode(b)).join('')).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}url.hash='layouts='+encodeURIComponent(packed);}else url.hash='layout='+encodeURIComponent(JSON.stringify({v:1,positions:pairLayouts()[currentContext()]||{}}));try{await navigator.clipboard.writeText(url.href);$('status').textContent='คัดลอกผังแล้ว · ส่งลิงก์กลับมาได้เลย'}catch{$('share-text').value=url.href;$('share-dialog').showModal();$('share-text').select();}};
 $('compact-controls').onclick=()=>{const head=document.querySelector('header'),small=head.classList.toggle('minimized');$('compact-controls').textContent=small?'ขยายแถบ':'ย่อแถบ';saveUrl()};
 $('close-share').onclick=()=>$('share-dialog').close();
 addEventListener('pagehide',()=>observer?.disconnect());
})();
</script></body></html>
