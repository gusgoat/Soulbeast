name: Publish Soulbeast Pages

on:
  push:
    branches: [codex/web-latest-20261103]
  workflow_dispatch:

concurrency:
  group: soulbeast-pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/codex/web-latest-20261103'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Stage and measure the public site
        run: node tools/prepare-pages.mjs "$RUNNER_TEMP/soulbeast-pages"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/soulbeast-pages

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
