name: Android internal APK and AAB
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['assets/shop/**', 'client/coupon-shop.css', 'tools/prepare-account-stage.cjs', 'server/payments/production/**', 'content/payment-packs.production.json', 'client/production-shop.mjs', 'client/billing-client.mjs', 'content/billing-channels.json', 'tools/test-production-payments.cjs', 'tools/build-production-payments.cjs', 'assets/beasts/solar/**', 'assets/ui/solar-beast-frame.svg', 'content/solar-beasts.json', 'content/solar-art/**', 'runtime/solarBeasts.js', 'runtime/beastBalance.js', 'runtime/progression.js', 'runtime/pvp.js', 'tools/test-solar-beasts.cjs', 'assets/audio/**', 'content/audio*.json', 'runtime/uploadedAudio.js', 'runtime/accountManagement.js', 'runtime/classRefresh.js', 'runtime/classTen.js', 'server/accounts/*.sql', 'assets/beasts/eclipse-v2/**', 'assets/equipment/eclipse-v2/**', 'assets/equipment/eclipse-original/**', 'content/eclipse-original-art/**', 'content/eclipse-expansion.json', 'runtime/economy.js', 'runtime/beasts.js', 'runtime/exploration.js', 'runtime/social.js', 'runtime/persistence.js', 'content/localization.js', 'content/narrative.js', 'content/secrets.js', 'content/narrative-prose/**', 'runtime/worldTales.js', 'runtime/secrets.js', 'runtime/specialEvents.js', 'tools/test-narrative-prose.cjs', 'runtime/story.js', 'tools/test-localization.cjs', 'assets/skills/**', 'runtime/core.js', 'runtime/catalogs.js', 'runtime/ai.js', 'runtime/presentation.js', 'runtime/battleEffects.js', 'tools/test-battle-effects.cjs', 'runtime/combatUI.js', 'server/accounts/engine.ts', 'assets/ui/battle-scenes/**', 'content/battlefield-art-v2.json', 'assets/ui/unit-frames/**', 'runtime/unitFrames.js', 'runtime/status.js', 'runtime/inventory.js', 'runtime/ui.js', 'assets/ui/battle-frames/**', 'runtime/battleScenery.js', 'runtime/combat.js', 'runtime/network.js', 'runtime/manifest.json', 'assets/video/**', 'runtime/webIntro.js', 'client/styles.css', 'content/web-intro-media.json', 'mobile/**', 'runtime/accounts.js', 'client/play*', 'server/payments/play*', 'server/payments/google-play*', 'server/payments/003*', 'tools/test-play*', 'tools/build-play.cjs', 'tools/play-tests/**', 'client/account*', 'client/billing*', 'content/billing-channels.json', 'tools/build-mobile.cjs', '.github/workflows/android-internal.yml']
permissions:
  contents: read
concurrency:
  group: soulbeast-android-internal
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Install pinned dependencies
        run: |
          npm ci --prefix tools/runtime-build --ignore-scripts --no-audit --no-fund
          npm ci --prefix mobile --ignore-scripts --no-audit --no-fund
          npm ci --prefix tools/play-tests --ignore-scripts --no-audit --no-fund
      - name: Verify account and billing boundaries
        run: |
          npm run test:accounts
          npm run test:names
          npm run test:loading
          node tools/test-platform-billing.cjs
          npm run test:play
          npm run test:production
      - name: Build packaged web game and sync Android
        run: |
          node tools/build-mobile.cjs
          cd mobile
          npx --no-install cap sync android
      - name: Verify mobile package
        run: node tools/test-mobile.cjs
      - name: Build internal APK with runner's installed Android SDK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug
      - name: Prepare verified install-time media pack
        run: node tools/prepare-android-asset-pack.cjs
      - name: Build Play bundle and lint
        working-directory: mobile/android
        run: ./gradlew --no-daemon :app:bundleRelease :app:lintRelease
      - name: Mark unsigned bundle and verify package
        run: |
          echo "Bundle built without an upload key. NOT ready for Play upload until signed." > build/AAB-SIGNING-REQUIRED.txt
          unzip -l mobile/android/app/build/outputs/bundle/release/app-release.aab | head -20 || true
      - uses: actions/upload-artifact@v4
        with:
          name: soulbeast-android-apk-${{ github.sha }}
          path: |
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
            build/mobile-manifest.json
            build/AAB-SIGNING-REQUIRED.txt
            mobile/android/app/build/reports/lint-results-release.html
          retention-days: 14
          if-no-files-found: error
      - name: Split large bundle for transport without changing AAB bytes
        run: |
          mkdir -p build/aab-parts
          sha256sum mobile/android/app/build/outputs/bundle/release/app-release.aab > build/aab-parts/aab-sha256.txt
          split -b 350M -d mobile/android/app/build/outputs/bundle/release/app-release.aab build/aab-parts/app-release.aab.part-
      - uses: actions/upload-artifact@v4
        with:
          name: soulbeast-aab-part-0-${{ github.sha }}
          path: |
            build/aab-parts/app-release.aab.part-00
            build/aab-parts/aab-sha256.txt
            build/android-asset-pack.json
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: soulbeast-aab-part-1-${{ github.sha }}
          path: build/aab-parts/app-release.aab.part-01
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: soulbeast-android-aab-${{ github.sha }}
          path: |
            mobile/android/app/build/outputs/bundle/release/app-release.aab
            build/mobile-manifest.json
            build/AAB-SIGNING-REQUIRED.txt
          retention-days: 14
          if-no-files-found: error
