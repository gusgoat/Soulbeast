<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PVP สนามใหม่ · โลกทดสอบ</title><style>body{margin:0;background:#101b25;color:#f5dfaf;font:16px system-ui;display:grid;place-items:center;min-height:100dvh}main{max-width:420px;padding:24px;border:1px solid #b89353;border-radius:12px;background:linear-gradient(145deg,#1c3446,#101923)}button,a{display:block;padding:13px;margin:14px 0;background:#203b50;color:#f5dfaf;border:1px solid #b89353;border-radius:8px;text-align:center}p{line-height:1.6}</style><main><h1>PVP · สนามใหม่</h1><p>สำหรับบัญชีโลกทดสอบ ใช้ห้องและกติกาต่อสู้จากเซิร์ฟเวอร์เดิม</p><p id="status"></p><button id="launch">เปิด PVP ทดสอบ</button><a href="./accounts.html?world=test">เข้าสู่ระบบ / เลือกตัวละครโลกทดสอบ</a><button id="disable">ใช้สนาม PVP เดิม</button></main><script>const status=document.getElementById('status');function context(){try{return JSON.parse(sessionStorage.getItem('soulbeast-online-walk-v1')||'null')}catch{return null}}document.getElementById('launch').onclick=()=>{if(context()?.environment!=='test'){status.textContent='กรุณาเข้าสู่ระบบและเลือกตัวละครโลกทดสอบก่อน แล้วกลับมาเปิดหน้านี้';return}sessionStorage.setItem('soulbeast-new-pvp-test','on');location.href='./tools/town-walk-demo/menu.html?screen=pvp&v=pvp-performance-v3&load='+Date.now()};document.getElementById('disable').onclick=()=>{sessionStorage.removeItem('soulbeast-new-pvp-test');status.textContent='กลับไปใช้สนาม PVP เดิมแล้ว'};</script></html>
