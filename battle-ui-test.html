<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Soulbeast · ทดลองสนามใหม่</title><style>body{background:#0d1925;color:#efdfbb;font:17px/1.8 system-ui;padding:24px}main{max-width:620px;margin:10vh auto}button{background:#23394b;color:#ffe4a0;border:1px solid #bc9b55;padding:12px 18px;border-radius:9px;font:inherit;cursor:pointer}p{color:#c3cfda}</style><main><h1>ทดลองสนามต่อสู้ใหม่</h1><p>ใช้กับตัวละครในโลกทดสอบเท่านั้น เข้าสู่ระบบแล้วเลือกตัวละครและออกสำรวจได้ตามปกติ หากสนามใหม่มีปัญหา กด “ใช้สนามเดิม” เพื่อสู้ต่อจากตาปัจจุบัน</p><button id="new">เปิดสนามใหม่และเข้าสู่โลกทดสอบ</button><p><button id="old">กลับไปใช้สนามเดิม</button></p><p id="status"></p></main><script>document.getElementById('new').onclick=()=>{sessionStorage.setItem('soulbeast-new-battle-test','on');location.href='./accounts.html?world=test&entry=test-world-entry-20261122-1'};document.getElementById('old').onclick=()=>{sessionStorage.setItem('soulbeast-new-battle-test','off');location.href='./accounts.html?world=test&entry=test-world-entry-20261122-1'};</script></html>
