<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Soulbeast · แบบประตูห้องบอสทั้ง 8 พื้นที่</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0e171c;color:#ede6d5;font:16px/1.5 system-ui,sans-serif}header{padding:18px 24px;border-bottom:1px solid #ac95604d}h1{font-size:23px;margin:0 0 5px}p{margin:5px 0;color:#bdc9c9}.layout{display:grid;grid-template-columns:260px minmax(0,1fr);max-width:1300px;margin:auto}nav{padding:16px;display:grid;align-content:start;gap:8px}button{font:inherit;cursor:pointer;color:inherit;border:1px solid #a48b584d;border-radius:10px;background:#18282e;padding:11px 13px;text-align:left}nav button[aria-pressed=true]{background:#30494b;border-color:#d6bd7c}nav small{display:block;font-size:12px;color:#aebfc0}main{min-width:0;padding:18px}.heading{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}h2{font-size:23px;margin:0}.modes{display:flex;gap:8px}.modes button[aria-pressed=true]{background:#d6bc7c;color:#142128}#stage{display:block;width:100%;height:min(68vh,680px);min-height:390px;border-radius:14px;margin-top:14px;background:#17262a}#pieces{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}#pieces[hidden],#stage[hidden]{display:none}figure{margin:0;border:1px solid #a48b583d;border-radius:10px;background:#1b2a30;padding:10px}figure canvas{width:100%;height:210px;display:block}figcaption{font-size:13px;color:#cdd5cf;text-align:center}#status{min-height:24px;font-size:14px}#play{display:inline-block;margin-top:8px;color:#f0d48f}.badge{font-size:13px;color:#dcc48a}footer{font-size:13px;border-top:1px solid #a48b5833;margin-top:15px;padding-top:12px;color:#aebdc0}@media(max-width:760px){header{padding:14px}h1{font-size:20px}.layout{grid-template-columns:1fr}nav{display:flex;overflow:auto;padding:12px;gap:8px}nav button{flex:0 0 185px}main{padding:12px}#stage{height:61vh;min-height:360px}#pieces{grid-template-columns:repeat(2,minmax(0,1fr))}figure canvas{height:170px}h2{font-size:20px}}
#play[hidden]{display:none}</style></head><body>
<header><h1>Soulbeast · แบบประตูห้องบอสทั้ง 8 พื้นที่</h1><p>ประตูปิด ผนัง บันได และรูปปั้นบอสแยกชิ้น · บอสและกติกาใช้ของเดิม</p></header>
<div class="layout"><nav id="themes" aria-label="เลือกพื้นที่"></nav><main>
<div class="heading"><div><h2 id="title"></h2><p id="boss"></p></div><div class="modes"><button id="assembled" aria-pressed="true">ภาพประกอบ</button><button id="separate" aria-pressed="false">แยกชิ้น</button></div></div>
<p id="motif"></p><div class="badge" id="availability"></div><p id="status" role="status"></p>
<canvas id="stage" aria-label="ภาพประตูห้องบอสที่ประกอบแล้ว"></canvas><section id="pieces" aria-label="ชิ้นส่วนประตูห้องบอส" hidden></section>

<footer>หน้านี้ใช้ตรวจแบบประตู ส่วนพื้นที่ที่ยังไม่มีฉากเดินเป็นแบบเตรียมไว้สำหรับงานถัดไป ยังไม่ได้เผยแพร่เว็บจริง</footer>
</main></div><script type="module" src="./preview.js?v=moonlight-release-1"></script></body></html>
