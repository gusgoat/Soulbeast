<title>Soulbeast · ทดลองเปิดการ์ดสุริยคราส</title>

<body class="gacha-trial">
<main>
<section class="trial-panel gacha-machine">
<span class="trial-badge">โหมดทดลอง · ไม่ใช้คูปองจริง</span>
<h1>ลองเปิดการ์ดกาชาแบบใหม่</h1>
<p>เลือกชุดสุริยคราส หรือชุดคละอสูร อุปกรณ์ และไอเทมครบทุกระดับสี แตะหลังการ์ดเพื่อเปิด ส่วนวิดีโอจะเล่นเฉพาะอสูรสุริยคราส</p>
<p class="trial-note">ทดลองได้ไม่จำกัด ไม่เชื่อมบัญชี ไม่หักคูปอง และไม่เพิ่มรางวัลเข้าเกมจริง</p>
<div class="trial-actions">
<button class="btn pri" type="button" data-trial-draw="1">ทดลองสุ่ม 1 ใบ</button>
<button class="btn" type="button" data-trial-legend>ลองอสูรตำนาน 1 ใบ</button>
<button class="btn seal" type="button" data-trial-draw="10">ทดลองสุ่ม 10 ใบ</button>
<button class="btn" type="button" data-trial-all>ลองสุริยคราสครบ 8 ตัว</button>
<button class="btn" type="button" data-trial-mixed>ลองการ์ดคละทุกประเภท</button>
</div>
<label class="trial-sound"><input id="trialSound" type="checkbox" checked> เปิดเสียงวิดีโอ</label>
</section>
<p id="trialStatus" role="status" aria-live="polite">กดทดลองสุ่มเพื่อเริ่ม แล้วเลือกเปิดการ์ดที่ต้องการ</p>
<div id="trialCards"></div>
</main>
</body>
</html>
