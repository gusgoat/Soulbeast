<!doctype html><meta charset="utf-8"><title>ตรวจพิกัดผู้ผนึกสำหรับวางทางเข้า</title><h1>พิกัดที่ประกาศจากแผนที่บนเครื่องนี้</h1><pre id="positions"></pre><script>const rows=new Map(),bus=new BroadcastChannel('soulbeast-walk-presence-v1');bus.onmessage=({data:d})=>{if(d.type!=='position')return;rows.set(d.session,{place:d.place,x:d.x,y:d.y,name:d.player?.name,lv:d.player?.lv});document.getElementById('positions').textContent=JSON.stringify([...rows.values()],null,2)};bus.postMessage({type:'hello'});</script>
