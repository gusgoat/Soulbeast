<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Soulbeast · อสูรเคลื่อนไหว 177 ตัว</title>
<style>body{margin:auto;max-width:1000px;padding:20px;background:#102e36;color:#eff5e8;font:17px/1.6 system-ui}h1{font-size:25px;color:#e8ce90}button,select,input{padding:10px;border:1px solid #b8a66e;border-radius:7px;color:inherit;background:#24434b;font:inherit}select{max-width:100%}canvas{display:block;width:100%;background:radial-gradient(ellipse at center,#446455,#142e36);border:1px solid #9b8b58;border-radius:14px;margin:18px 0}nav{display:flex;gap:8px;flex-wrap:wrap}.hint{color:#b9d0ce}a{color:#a9e1fa}#status{min-height:28px}</style>
<h1>อสูรเคลื่อนไหว 177 ตัว</h1><p>ใช้ตัวเดินชุดล่าสุดที่ทำไว้ รวมเดรคเมฆาและวิปส์รุ่นแก้ เลือกดูแต่ละร่างได้ด้านล่าง</p>
<nav><select id="pick" aria-label="เลือกอสูร"></select><button id="previous">ก่อนหน้า</button><button id="next">ถัดไป</button><button id="drake">เดรคเมฆา</button><button id="wisps">วิปส์ 3 ร่าง</button></nav>
<canvas id="preview" width="1000" height="570"></canvas><p id="status" role="status"></p><p class="hint">แอนิเมชันวน 3 วินาที · แสดงหน้าตาจริงครบ 8 ทิศ · โหลดเฉพาะตัวที่เลือก</p>
<a href="../hemant-walk-demo/index.html?country=green&layout=regions-v5&region=N&arrival=beasts&packlord3d=1&roster=1&v=living-177-2">ลองเดินในฉากประเทศ</a>
<script src="../../assets/living-beasts/catalog.js?v=field-size-1"></script><script src="../town-walk-demo/beast-habitats.js?v=living-177-2"></script><script src="../town-walk-demo/living-beasts.js?v=field-size-1"></script>
<script>
const canvas=document.getElementById('preview'),ctx=canvas.getContext('2d'),pick=document.getElementById('pick'),models=LivingBeastCatalog.models,renderer=LivingBeasts.create({cell:192,cacheSize:3});let actors=[],started=performance.now();
for(const m of models){const option=document.createElement('option');option.value=m.id;option.textContent=m.name;pick.append(option);}
function show(ids){actors=ids.map((id,i)=>{const m=models.find(m=>m.id===id),a={sp:m.sp,form:m.form,lv:55,x:canvas.width*(i+1)/(ids.length+1),y:620};LivingBeasts.ensure(a);a.livingPhase=0;return a;});started=performance.now();void renderer.preload(actors);pick.value=ids[0];document.getElementById('status').textContent='กำลังโหลด…';}
pick.onchange=()=>show([pick.value]);document.getElementById('previous').onclick=()=>show([models[(models.findIndex(m=>m.id===pick.value)+models.length-1)%models.length].id]);document.getElementById('next').onclick=()=>show([models[(models.findIndex(m=>m.id===pick.value)+1)%models.length].id]);document.getElementById('drake').onclick=()=>show(['storm_drake']);document.getElementById('wisps').onclick=()=>show(['wisp','wisp_ghostfire','wisp_death_lantern']);
const initial=new URLSearchParams(location.search).get('beast');show([models.some(m=>m.id===initial)?initial:'storm_drake']);
function frame(now){const time=(now-started)/1000,heading=Math.floor(time/3)%8;ctx.clearRect(0,0,canvas.width,canvas.height);for(const [i,a]of actors.entries()){const x=canvas.width*(i+1)/(actors.length+1)+Math.sin(time*.75)*32,y=400;a.x=x;a.y=y/.64;ctx.fillStyle='#071d2760';ctx.beginPath();ctx.ellipse(x,y+3,42,12,0,0,Math.PI*2);ctx.fill();renderer.draw(ctx,a,x,y,actors.length===1?340:240,time,{heading});ctx.fillStyle='#f1dfb4';ctx.font='19px system-ui';ctx.textAlign='center';ctx.fillText(a.beastName,x,500);}const stats=renderer.stats();document.getElementById('status').textContent=stats.errors.length?'โหลดภาพไม่สำเร็จ กรุณารีเฟรชอีกครั้ง':actors.every(a=>renderer.ready(a))?actors.map(a=>a.beastName).join(' · '):'กำลังโหลด…';canvas.dataset.loaded=actors.every(a=>renderer.ready(a));canvas.dataset.models=actors.map(a=>a.beastModelId).join(',');requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
