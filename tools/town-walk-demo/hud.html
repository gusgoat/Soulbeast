const countryFlags=[{"id":"blue","name":"เหมันตคีรี","flag":"assets/ui/country-war/flag-blue-v1.webp"},{"id":"green","name":"พนาสมุทร","flag":"assets/ui/country-war/flag-green-v1.webp"},{"id":"red","name":"อัคนีบรรพต","flag":"assets/ui/country-war/flag-red-v1.webp"}];
let partyMember=null,partyGold,partyCompanion;
const companionNav=document.querySelector('.bottom [data-v="team"] img');
const defaultCompanionIcon=companionNav.getAttribute('src');
let companionKey,companionPortraits;
function syncCompanion(player){
 if(document.body.dataset.edge!=='bottom')return;
 const pet=partyCompanion===undefined?window.CompanionFollowers.first(player):partyCompanion;
 const key=pet?pet.sp+':'+pet.form:null;
 if(key===companionKey)return;
 companionKey=key;
 companionNav.dataset.companion=key||'';
 companionNav.src=defaultCompanionIcon;
 if(!pet)return;
 const art=window.PartyArt[pet.sp],src=art?.forms?.[pet.form]||(pet.form===0?art?.image:null);
 if(src){companionNav.src=src;return;}
 companionPortraits??=import('/Soulbeast/tools/colosseum/pvp-card-art.mjs?v=battle-parity-1');
 void companionPortraits.then(({beastPortraits})=>{
  if(companionKey!==key)return;
  const forms=beastPortraits[pet.sp],portrait=forms?.[pet.form]||forms?.[0]||art?.image;
  if(portrait)companionNav.src=portrait.replace(/^\/assets\//,'/Soulbeast/assets/');
 }).catch(()=>{if(companionKey===key&&art?.image)companionNav.src=art.image;});
}
function syncVitals(p){const root=document.getElementById('walkHeroVitals');if(!root)return;root.hidden=!p;if(!p)return;const max=partyMember?{hp:Math.max(1,partyMember.maxHp||1),mp:Math.max(1,partyMember.maxMp||1)}:window.WalkVitals.maximum(p);if(partyMember)p=partyMember;for(const [key,id]of [['hp','walkHeroHp'],['mp','walkHeroMp']])document.getElementById(id).style.width=(Math.max(0,Math.min(1,(Number(p[key])||0)/max[key]))*100)+'%'}
function syncPortrait(p){const record=window.sealerSpriteCatalog?.[p.cls];if(!record)return;const entry=record[p.gender==='male'?'male':'female'];for(const img of document.querySelectorAll('.top .atlas-face,.bottom [data-v="hero"] img'))img.src=entry.portrait;document.querySelector('.who .sub').textContent=record.name}
document.body.dataset.edge=new URLSearchParams(location.search).get('edge')||'top';
let lastVitalsSave;
const playerKey='soulbeast-walk-preview-player-v1';
function sync(){try{
 const raw=sessionStorage.getItem(playerKey);
 let p=JSON.parse(raw||'null');
 lastVitalsSave=raw;if(partyMember)p={...p,...partyMember,lv:partyMember.level,gold:partyGold??p?.gold};syncCompanion(p);if(!p){syncVitals(null);const q=new URL(parent.location.href).searchParams,id=q.get('country')||(q.get('from')||q.get('city')||'blue').split('-')[0];document.querySelector('.who small').textContent='Lv 40 · '+({blue:'เหมันตคีรี',green:'พนาสมุทร',red:'อัคนีบรรพต'}[id]||'เหมันตคีรี');return}syncVitals(p);syncPortrait(p);document.querySelector('[data-user-content]').textContent=p.name;document.querySelector('.who small').textContent='Lv '+p.lv+' · '+(parent.location.pathname.includes('labyrinth-demo')?parent.document.title:parent.location.pathname.includes('hemant-walk')?({blue:'เหมันตคีรี',green:'พนาสมุทร',red:'อัคนีบรรพต'}[new URL(parent.location.href).searchParams.get('country')||(new URL(parent.location.href).searchParams.get('from')||'blue').split('-')[0]]||'เหมันตคีรี'):window.townProfiles.get(new URL(parent.location.href).searchParams.get('city')).name);document.querySelector('.coin').textContent=Number(p.gold||0).toLocaleString('th-TH')+' เหรียญ';const country=countryFlags.find(c=>c.id===p.country),slot=document.getElementById('walkCountryFlag');slot.replaceChildren();slot.title=country?country.name:'ยังไม่เลือกประเทศ';slot.setAttribute('aria-label',slot.title);if(country){const img=document.createElement('img');img.src=country.flag;img.alt=country.name;slot.append(img)}else slot.textContent='⚑';}catch{}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;e.preventDefault();parent.postMessage({type:'walk-menu',screen:b.dataset.a==='couponShop'?'coupon':b.dataset.v||'settings'},location.origin)});addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==parent)return;if(e.data?.type==='party-hud-state'){partyMember=e.data.member;partyGold=e.data.gold;partyCompanion=e.data.companion;sync();}else if(e.data?.type==='walk-hud-refresh')sync()});sync();if(document.body.dataset.edge==='top')setInterval(()=>{try{
 if(partyMember||document.hidden)return;
 const raw=sessionStorage.getItem(playerKey);
 if(raw===lastVitalsSave)return;
 syncVitals(JSON.parse(raw||'null'));
 lastVitalsSave=raw;
}catch{}},750);
</script></body></html>
