<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Soulbeast · เควสตัวอย่างครบวงจร</title><link rel="stylesheet" href="quest-events.css?v=quest-touch-1"><style>body{margin:0;background:#081923;color:#f5e6c6;font:16px/1.55 system-ui,sans-serif}main{max-width:640px;margin:auto;padding:16px}h1{font-size:1.4rem}nav{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}input{font:inherit;min-height:46px;padding:8px;box-sizing:border-box;max-width:100%;background:#17313e;color:#ffe8b8;border:1px solid #b79b64;border-radius:8px}button,select{font:inherit;min-height:46px;background:#244654;color:#ffebba;border:1px solid #b79b64;border-radius:8px;padding:10px 12px;max-width:100%;cursor:pointer}label{min-width:0;display:grid;gap:4px;font-size:.85rem}small{color:#b8c9cf}#actions{display:grid;gap:10px;margin:14px 0}#summary{padding:12px;border-left:3px solid #d4b274;background:#122e3d}#history{display:grid;gap:12px}#history .quest-event{margin-top:12px}iframe{display:block;width:390px;max-width:100%;height:80vh;border:1px solid #56717e;margin:auto}#reset{background:#3c3d36}#balance{font-variant-numeric:tabular-nums}@media(max-width:480px){main{padding:12px}nav label{width:100%}select{width:100%}h1{font-size:1.25rem}}</style></head><body><main><h1>เควสตัวอย่าง · เล่นให้จบวงจร</h1><small>ใช้ข้อมูลจำลอง ไม่อ่านหรือเปลี่ยนเซฟผู้เล่นจริง</small><nav><label>ประเทศ<select id="country"><option value="blue">เหมันตคีรี</option><option value="green">พนาสมุทร</option><option value="red">อัคนีบรรพต</option></select></label><label id="searchLabel">ค้นชื่อเควส / NPC<input id="search" type="search" placeholder="เช่น เกวียน หรือ อรัญ"></label><label>เควส<select id="quest"><option value="promotion25">เปลี่ยนอาชีพ Lv 25</option><option value="promotion40">เปลี่ยนอาชีพ Lv 40</option><option value="lost">คนหาย</option><option value="gem">อัญมณี</option><option value="courier">ส่งสารสี่เมือง</option><option value="choice-story">จดหมายเปล่า · สองทางเลือก</option><option value="treasure">หีบเสบียง</option></select></label><a id="library" href="?library=1">ดูเควสทั้งหมด</a><button id="reset">เริ่มใหม่</button><button id="reload">เปิดเซฟจำลองอีกครั้ง</button><button id="mobile">ดูจอมือถือ</button></nav><p id="summary" role="status"></p><small id="balance"></small><div id="cards"></div><div id="actions"></div><details><summary>ย้อนดูเหตุการณ์ที่ผ่านมา</summary><div id="history"></div></details></main><script src="world-quests-data.js"></script><script src="quest-pilot-visuals.js"></script><script src="quest-expansion-visuals.js?v=quest-expansion-20261106"></script><script src="../hemant-walk-demo/treasure-catalog.js"></script><script src="../hemant-walk-demo/treasures.js"></script><script src="quest-engine.js"></script><script src="quest-event-art.js"></script><script src="quest-events.js"></script><script>
const E=WalkQuestEngine,V=WalkQuestEvents,D=WorldQuestData,$=id=>document.getElementById(id);let p,q,choice,history=[];
if(location.protocol==='file:'){const localize=v=>typeof v==='string'?v.replace(/^\/Soulbeast\//,'../../'):Array.isArray(v)?v.map(localize):v&&typeof v==='object'?Object.fromEntries(Object.entries(v).map(([k,x])=>[k,localize(x)])):v;const show=V.present;V.present=(body,models)=>show(body,models.map(localize));}
function button(label,action,parent=$('actions')){const b=document.createElement('button');b.textContent=label;b.onclick=action;parent.append(b)}
function show(m,record=true){$('cards').replaceChildren();V.present($('cards'),[m]);if(record){history.push(m);$('history').replaceChildren();for(const old of history)V.present($('history'),[old]);}$('balance').textContent='เงิน '+p.gold+' เหรียญ · ระดับ '+p.lv;}
function begin(){const filter=$('search').value.trim();if(params.get('library')&&$('quest').dataset.country!==$('country').value+'|'+filter){const selected=$('quest').value;$('quest').replaceChildren();for(const quest of D.quests.filter(q=>q.country===$('country').value&&(!filter||(q.title+' '+(D.npcs[q.place]?.[q.npc]||'')+' '+D.placeNames[q.place]).includes(filter)))){const option=document.createElement('option');option.value=quest.id;option.textContent=(D.placeNames[quest.place]||quest.place)+' · '+quest.title;$('quest').append(option)}$('quest').dataset.country=$('country').value+'|'+filter;if([...$('quest').options].some(option=>option.value===selected))$('quest').value=selected;}choice=null;history=[];p={lv:60,country:$('country').value,gold:1000};E.state(p);p.worldQuests.completed[p.country+'-capital:promotion25']=$('quest').value.endsWith('promotion40')?1:undefined;q=D.quests.find(q=>q.id===($('quest').value.includes(':')?$('quest').value:p.country+'-capital:'+$('quest').value));if(!q){$('cards').replaceChildren();$('cards').textContent='ไม่พบเควสที่ตรงกับคำค้น';$('summary').textContent='ลองเปลี่ยนชื่อเควสหรือ NPC';$('balance').textContent='';$('actions').replaceChildren();return}if(q.requires)E.state(p).completed[q.requires]=1;$('actions').replaceChildren();$('history').replaceChildren();$('summary').textContent='อ่านภาพและเงื่อนไขก่อนรับงาน';show(V.model(p,q,'offered'),false);if(q.choices){for(const c of q.choices){const section=V.present($('cards'),[V.model(p,q,'offered',{choiceId:c.id})]);$('cards').append(section);section.firstChild.classList.add('quest-event-choice');button(c.label+' · จ่าย '+(c.cost||0)+' เหรียญ',()=>accept(c.id),section.firstChild)}}else button('รับภารกิจ',()=>accept());}
function accept(id){if(!E.accept(p,q,id))throw Error('รับเควสไม่ได้');choice=id;show(V.model(p,q,'accepted'));next();}
function next(){const a=E.state(p).accepted[q.id],o=a&&E.steps(p,q)[a.step];$('actions').replaceChildren();if(!a){$('summary').textContent='ภารกิจสำเร็จ · รับรางวัลแล้ว';button('เริ่มเควสนี้ใหม่',begin);return}if(!o){$('summary').textContent='ครบเป้าหมายแล้ว กลับรายงานผู้มอบหมาย';button('รายงานผลและรับรางวัล',claim);return}$('summary').textContent='เป้าหมาย: '+o.label+(o.count?' · '+a.count+'/'+o.count:'');if(o.type==='forestSearch'){show(V.model(p,q,'discovered',{objectiveStep:a.step}),false);button(o.visual?.discover?.actionLabel||(o.target==='lost-person'?'ช่วยพาผู้หลงทางกลับจุดพัก':o.target==='moon-gem'?'เก็บอัญมณีเพื่อส่งคืน':'ตรวจเบาะแสและบันทึกหลักฐาน'),act)}else button(o.type==='defeat'?'ชนะ'+(o.kind==='shadow'?'เงาอสูร':'โจรป่า')+' 1 กลุ่ม':o.type==='chest'?'เปิดหีบและรับสมบัติ':o.label,act);}
function act(){const a=E.state(p).accepted[q.id],i=a.step,o=E.steps(p,q)[i],before=V.snapshot(p,[q]);let loot;if(o.type==='chest'){const owner={home:{x:0,y:0},questId:'pilot-'+q.id+'-'+i+'-'+a.count},storage={getItem:()=>JSON.stringify(p),setItem:(key,value)=>{p=JSON.parse(value)}},nav={walkable:()=>true,clear:()=>true,distance:()=>0},treasures=hemantTreasures.create(nav,[owner],storage,hemantTreasureCatalog,()=>0,p.country);treasures.unlock(owner);loot=treasures.claim(treasures.chests[0],{x:0,y:0});if(!loot.ok)throw Error('เปิดหีบไม่ได้')}if(o.type==='craft'){p.owned||=[];p.owned.push('cf_riddle7_gloves')}if(o.type==='captureRare'){p.pets||=[];p.pets.push({uid:1,sp:'fenrir'})}const event={...o,...(o.type==='craft'?{gearId:'cf_riddle7_gloves',gearName:'ถุงมือตราช่างฝึก'}:{}),...(o.type==='captureRare'?{beastSp:'fenrir',beastName:'เฟนรีร์'}:{}),count:1,questId:q.id,objectiveStep:i,country:E.objectiveCountry(q,o)||q.country,depth:o.depth||(o.target==='moon-gem'?3:2),id:crypto.randomUUID()};if(!E.emit(p,[q],event))throw Error('เป้าหมายไม่ผ่าน');const models=V.changes(p,[q],before,event);for(const m of models)show(m);if(loot)V.present($('cards'),[V.loot(loot)]);next();}
function claim(){if(!E.claim(p,q,q.place,q.npc))throw Error('ส่งเควสไม่ได้');show(V.model(p,q,'completed'));next();}
$('search').oninput=begin;$('country').onchange=begin;$('quest').onchange=begin;$('reset').onclick=begin;$('reload').onclick=()=>{p=JSON.parse(JSON.stringify(p));const a=E.state(p).accepted[q.id];show(V.model(p,q,E.state(p).completed[q.id]?'completed':a?'accepted':'offered'),false);next()};$('mobile').onclick=()=>{const f=document.createElement('iframe');f.title='เควสตัวอย่างบนจอมือถือ';f.src='quest-pilots-preview.html?mobile=1&country='+$('country').value+'&quest='+encodeURIComponent($('quest').value)+(params.get('library')?'&library=1&search='+encodeURIComponent($('search').value):'');$('cards').replaceChildren(f);$('actions').replaceChildren();$('summary').textContent='ตัวอย่างพื้นที่จอมือถือ'};const params=new URLSearchParams(location.search);$('searchLabel').hidden=!params.get('library');if(params.get('search'))$('search').value=params.get('search');if(params.get('mobile'))$('mobile').hidden=true;if(params.get('country'))$('country').value=params.get('country');if(params.get('library')){$('library').textContent='กลับชุดตัวอย่าง';$('library').href='quest-pilots-preview.html';document.querySelector('h1').textContent='เควสทั้งหมด · ภาพและขั้นตอน';begin()}if(params.get('quest'))$('quest').value=params.get('quest');begin();
</script></body></html>
