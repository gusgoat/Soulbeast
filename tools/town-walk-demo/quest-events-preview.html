<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Soulbeast · ตัวอย่างเหตุการณ์เควส</title><link rel="stylesheet" href="quest-events.css?v=quest-expansion-20261106"><style>body{margin:0;background:#081923;color:#f5e6c6;font:16px/1.55 system-ui,sans-serif}main{max-width:620px;margin:auto;padding:20px}nav{display:flex;gap:8px;flex-wrap:wrap;position:sticky;top:0;background:#081923ed;padding:12px 0;z-index:2}nav button,select{min-height:44px;padding:8px 12px;border:1px solid #a78d56;border-radius:6px;background:#17313e;color:#ffe8b8;font:inherit}small{color:#adbfca}h1{font-size:1.5rem}.quest-answer{min-height:48px;width:100%;padding:12px;margin:12px 0;background:#294c58;color:#ffe8b8;border:1px solid #a78d56;border-radius:8px;font:inherit}iframe{display:block;border:1px solid #617783;height:80vh;margin:auto;max-width:100%;background:#081923}</style></head><body><main><h1>ภาพเหตุการณ์เควส</h1><small>ตัวอย่างจากข้อมูลจำลอง ไม่อ่านหรือเปลี่ยนเซฟผู้เล่น</small><nav><select id="scene" aria-label="เลือกเหตุการณ์"><option value="accept">รับเควส</option><option value="lost">พบและช่วยคนหลงทาง</option><option value="gem">พบอัญมณี</option><option value="talk">รับคำรับรอง</option><option value="complete">ส่งเควสเปลี่ยนอาชีพ</option><option value="choice">ยืนยันทางเลือก</option><option value="loot">เปิดหีบ</option><option value="tray">แจ้งความคืบหน้า</option></select><button id="mobile">ดูจอมือถือ</button></nav><div id="cards"></div></main><script src="world-quests-data.js"></script><script src="quest-pilot-visuals.js?v=quest-expansion-20261106"></script><script src="quest-expansion-visuals.js?v=quest-expansion-20261106"></script><script src="quest-engine.js"></script><script src="quest-event-art.js"></script><script src="quest-events.js"></script><script>
const Q=WorldQuestData.quests,E=WalkQuestEngine,V=WalkQuestEvents,cards=document.getElementById('cards'),picker=document.getElementById('scene');
if(location.protocol==='file:'){const localize=v=>typeof v==='string'?v.replace(/^\/Soulbeast\//,'../../'):Array.isArray(v)?v.map(localize):v&&typeof v==='object'?Object.fromEntries(Object.entries(v).map(([k,x])=>[k,localize(x)])):v;const show=V.present,notify=V.push;V.present=(body,models)=>show(body,models.map(localize));V.push=(models,options)=>notify(models.map(localize),options);}
function preview(){cards.replaceChildren();const type=picker.value,p={lv:60,country:'blue',gold:10000},q=Q.find(q=>q.id==='blue-capital:'+(type==='lost'?'lost':type==='gem'?'gem':type==='choice'?'choice-story':type==='accept'?'courier':'promotion25'));E.accept(p,q,type==='choice'?'orders':undefined);
 if(type==='loot'){V.present(cards,[V.loot({id:'pot',name:'ยาฟื้นพลัง',qty:2,gold:150})]);return}
 if(type==='accept'||type==='choice'){V.present(cards,[V.model(p,q,'accepted')]);return}
 if(type==='lost'||type==='gem'){V.present(cards,[V.model(p,q,'discovered',{objectiveStep:0})]);const button=document.createElement('button');button.textContent=type==='lost'?'ช่วยพาผู้หลงทางกลับจุดพัก':'เก็บอัญมณีเพื่อส่งคืน';button.className='quest-answer';button.onclick=()=>{E.emit(p,[q],{...q.steps[0],questId:q.id,objectiveStep:0,country:type==='lost'?'blue':'green',depth:3,id:'preview'});cards.replaceChildren();V.present(cards,[V.model(p,q,'step',{objectiveStep:0})])};cards.append(button);return}
 if(type==='tray'){const m=V.model(p,q,'progress',{objectiveStep:0});V.push([m]);cards.textContent='กดแถบแจ้งเตือนด้านบนเพื่อดูภาพเหตุการณ์';return}
 for(let i=0;i<5;i++)E.emit(p,[q],{id:'kill'+i,type:'defeat',country:'blue',kind:'shadow'});E.emit(p,[q],{id:'forge',type:'talk',country:'blue',place:'blue-capital',target:'forge'});if(type==='complete'){E.claim(p,q,q.place,'questboard');V.present(cards,[V.model(p,q,'completed')])}else V.present(cards,[V.model(p,q,'step',{objectiveStep:1})]);
}
picker.onchange=preview;document.getElementById('mobile').onclick=()=>{const frame=document.createElement('iframe');frame.title='ตัวอย่างจอมือถือ 390 พิกเซล';frame.style.width='390px';frame.src='quest-events-preview.html?embedded=1&scene='+picker.value;cards.replaceChildren(frame)};const params=new URLSearchParams(location.search);if(params.get('embedded'))document.getElementById('mobile').hidden=true;if(params.get('scene'))picker.value=params.get('scene');preview();
</script></body></html>
